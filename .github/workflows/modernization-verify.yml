name: Modernization verify

on:
  push:
    branches: [master, "cursor/**"]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (compile probe; source/target 1.8)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make scripts executable
        run: chmod +x scripts/verify-modernization.sh scripts/verify-mm-fixtures.py scripts/backup-mindmaps.sh

      - name: Run modernization gate
        run: ./scripts/verify-modernization.sh
