name: Update Pages release data

# Site lives in docs/ (GitHub Pages: Deploy from a branch → master → /docs).
# This workflow refreshes docs/data/release.json on each Release publish.
# The page also reads the GitHub Releases API in the browser as a live fallback.

on:
  release:
    types: [published]
  push:
    branches: [master]
    paths:
      - "docear_plugin_core/resources/version.properties"
      - "scripts/update-pages-release.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-release-data
  cancel-in-progress: true

jobs:
  sync-release-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Commit back to the same branch that triggered the workflow
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}

      - name: Generate docs/data/release.json
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_HTML_URL: ${{ github.event.release.html_url }}
          RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/update-pages-release.py \
            --out docs/data/release.json \
            --version-properties docear_plugin_core/resources/version.properties \
            --event-name "$EVENT_NAME" \
            --release-tag "${RELEASE_TAG:-}" \
            --release-name "${RELEASE_NAME:-}" \
            --release-html-url "${RELEASE_HTML_URL:-}" \
            --release-published-at "${RELEASE_PUBLISHED_AT:-}" \
            --repo "${{ github.repository }}"
          cat docs/data/release.json

      - name: Commit release.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(pages): sync release.json [skip ci]"
          file_pattern: docs/data/release.json
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
