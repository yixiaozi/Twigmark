todoist.settings.hint=<html><b>1:1 link:</b> each mind-map node with a reminder is permanently paired with one Todoist task (any .mm file). Text and due time sync both ways.<br/><b>Auto sync:</b> edits push after ~1.5s; periodic sync also pulls remote changes onto linked nodes and imports only <i>unlinked</i> Todoist tasks into the inbox map.<br/><b>Sync with Todoist</b> runs the full push → pull linked → import unlinked flow.<br/>Token: Todoist Settings &gt; Integrations &gt; Developer.</html>
