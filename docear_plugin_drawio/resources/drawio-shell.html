<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Docear Draw.io</title>
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f5f5f5; }
iframe { border: 0; width: 100%; height: 100%; }
#status {
  position: absolute; left: 0; right: 0; top: 0; padding: 12px 16px;
  font: 14px/1.4 sans-serif; color: #333; background: #fffbe6; border-bottom: 1px solid #f0e6a6;
  display: none; z-index: 2;
}
</style>
</head>
<body>
<div id="status"></div>
<iframe id="editor" allowfullscreen></iframe>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var embedBase = params.get('embedBase') || 'https://embed.diagrams.net/';
  if (embedBase.indexOf('?') < 0) {
    embedBase += '?';
  } else if (!embedBase.endsWith('&') && !embedBase.endsWith('?')) {
    embedBase += '&';
  }
  // keep=1 avoids discard prompts; libraries=1 enables shape libs; configure=0 skips extra dialogs
  var editorUrl = embedBase
    + 'embed=1&proto=json&ui=min&libraries=1&spin=1&saveAndExit=1&noSaveBtn=0&noExitBtn=0'
    + '&modified=unsavedChanges&keepmodified=1';
  var frame = document.getElementById('editor');
  var statusEl = document.getElementById('status');
  var queue = [];
  var editorReady = false;

  function setStatus(msg) {
    if (!msg) {
      statusEl.style.display = 'none';
      statusEl.textContent = '';
      return;
    }
    statusEl.style.display = 'block';
    statusEl.textContent = msg;
  }

  setStatus('正在加载 Draw.io…（需要访问 ' + embedBase.split('?')[0] + '）');
  frame.src = editorUrl;

  function deliver(msg) {
    if (frame.contentWindow) {
      frame.contentWindow.postMessage(JSON.stringify(msg), '*');
    }
  }

  function postToEditor(msg) {
    if (!editorReady) {
      queue.push(msg);
      return;
    }
    deliver(msg);
  }

  window.postToEditor = postToEditor;

  function forwardToJava(payload) {
    try {
      if (window.javaBridge && window.javaBridge.onEditorMessage) {
        window.javaBridge.onEditorMessage(payload);
      }
    } catch (e) {
      console.error(e);
    }
  }

  window.addEventListener('message', function(evt) {
    if (!evt.data || evt.source !== frame.contentWindow) {
      return;
    }
    var raw = typeof evt.data === 'string' ? evt.data : JSON.stringify(evt.data);
    var parsed = null;
    try {
      parsed = typeof evt.data === 'string' ? JSON.parse(evt.data) : evt.data;
    } catch (e) {
      parsed = null;
    }
    if (parsed && parsed.event === 'init') {
      editorReady = true;
      setStatus('');
      while (queue.length) {
        deliver(queue.shift());
      }
    }
    forwardToJava(raw);
  });

  // Surface slow/failed iframe loads to the user.
  setTimeout(function() {
    if (!editorReady) {
      setStatus('Draw.io 仍在加载或未能连接。若长时间无响应，请检查网络/代理，或配置本地 drawio.embed.url。');
    }
  }, 20000);
})();
</script>
</body>
</html>
