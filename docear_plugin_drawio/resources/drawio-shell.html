<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Docear Draw.io</title>
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f5f5f5; }
iframe { border: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<iframe id="editor" allowfullscreen></iframe>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var embedBase = params.get('embedBase') || 'https://embed.diagrams.net/';
  if (embedBase.indexOf('?') < 0) {
    embedBase += '?';
  } else if (!embedBase.endsWith('&') && !embedBase.endsWith('?')) {
    embedBase += '&';
  }
  var editorUrl = embedBase + 'embed=1&proto=json&ui=min&libraries=1&spin=1&saveAndExit=1&modified=unsavedChanges';
  var frame = document.getElementById('editor');
  frame.src = editorUrl;

  function postToEditor(msg) {
    if (frame.contentWindow) {
      frame.contentWindow.postMessage(JSON.stringify(msg), '*');
    }
  }

  window.postToEditor = postToEditor;

  window.addEventListener('message', function(evt) {
    if (!evt.data || evt.source !== frame.contentWindow) {
      return;
    }
    try {
      var payload = typeof evt.data === 'string' ? evt.data : JSON.stringify(evt.data);
      if (window.javaBridge && window.javaBridge.onEditorMessage) {
        window.javaBridge.onEditorMessage(payload);
      }
    } catch (e) {
      console.error(e);
    }
  });
})();
</script>
</body>
</html>
