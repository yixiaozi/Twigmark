mcp.enabled=true
mcp.port=7720
mcp.host=127.0.0.1
mcp.readonly=false
mcp.auth.enabled=false
mcp.auth.apiKey=
mcp.auth.role=owner
# Extra keys: {configDir}/mcp-access.json (see docs/MCP_AUTH_AND_WEB.md)
mcp.auth.keysFile=
mcp.web.enabled=true
mcp.web.llm.baseUrl=https://openrouter.ai/api/v1
mcp.web.llm.apiKey=
mcp.web.llm.model=openai/gpt-4o-mini
mcp.web.llm.maxToolRounds=8
mcp.webchat.sessionTtlHours=720
# Web security (public/VPS): read-only tools, registration token, LLM host allowlist
mcp.web.readOnlyTools=false
mcp.web.registrationToken=
mcp.web.llm.allowedHosts=openrouter.ai,api.openai.com,api.openai.com.cn,api.deepseek.com,api.moonshot.cn,generativelanguage.googleapis.com,api.anthropic.com,api.groq.com,api.together.xyz,api.perplexity.ai,api.x.ai
mcp.audit.enabled=true
mcp.audit.maxEntries=1000
mcp.audit.queueSize=5000
mcp.audit.batchSize=200
mcp.audit.maxResponseBytes=524288
mcp.cursorPlugin.sync.enabled=true
mcp.cursorPlugin.sync.delayMs=12000
