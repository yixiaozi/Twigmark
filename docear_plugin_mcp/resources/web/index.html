<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <title>Twigmark</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="auth-view" class="auth-view">
      <div class="auth-shell">
        <div class="auth-brand">
          <div class="logo-mark" aria-hidden="true"></div>
          <h1>Twigmark</h1>
              <p class="lede">导图库网页版：键盘友好浏览、搜索，并对任意导图提问。</p>
        </div>
        <form class="auth-card" id="auth-form" autocomplete="on">
          <p class="muted" id="auth-hint">登录后访问导图库与对话。</p>
          <label>账号 <input id="auth-user" name="username" autocomplete="username" /></label>
          <label>密码 <input id="auth-pass" name="password" type="password" autocomplete="current-password" /></label>
          <div class="auth-actions">
            <button type="submit" id="btn-login" class="primary">登录</button>
            <button type="button" id="btn-register" class="ghost">首次注册</button>
          </div>
          <p id="auth-error" class="err"></p>
        </form>
      </div>
    </div>

    <div id="app-view" class="app hidden">
      <header class="app-bar">
        <div class="app-brand">
          <div class="logo-mark small" aria-hidden="true"></div>
          <div>
            <strong>Twigmark</strong>
            <span class="muted tiny block" id="db-meta">…</span>
          </div>
        </div>
        <nav class="app-nav" aria-label="主导航">
          <button type="button" class="nav-btn active" data-view="library">导图库</button>
          <button type="button" class="nav-btn" data-view="chat">对话</button>
          <button type="button" class="nav-btn" data-view="settings">模型</button>
        </nav>
        <div class="app-bar-right">
          <span id="who" class="pill">…</span>
          <button type="button" id="btn-logout" class="ghost small">退出</button>
        </div>
      </header>

      <section id="view-library" class="view">
        <div class="library-layout" id="library-layout">
          <aside class="library-side">
            <div class="side-head">
              <h2>导图库</h2>
              <button type="button" id="btn-refresh-maps" class="ghost small">刷新</button>
            </div>
            <label class="search-field">
              <span class="sr-only">搜索导图</span>
              <input id="map-filter" placeholder="搜索文件名 / 路径…" />
            </label>
            <p class="muted tiny" id="map-count">加载中…</p>
            <div id="map-list" class="map-list"></div>
          </aside>

          <div class="library-main" id="library-main">
            <div id="library-empty" class="empty-state">
              <h2>选择一张导图</h2>
              <p>从左侧打开任意导图。滚轮浏览大纲，键盘 ↑↓ 移动、←→ 展开折叠，右侧看详情。</p>
            </div>

            <div id="map-viewer" class="map-viewer hidden">
              <header class="viewer-head">
                <div class="viewer-titles">
                  <h2 id="viewer-title">导图</h2>
                  <p class="muted tiny" id="viewer-path"></p>
                </div>
                <div class="viewer-actions">
                  <label class="search-field compact">
                    <input id="node-filter" placeholder="筛选节点 ( / )" />
                  </label>
                  <button type="button" id="btn-expand-all" class="ghost small" title="全部展开">展开</button>
                  <button type="button" id="btn-collapse-all" class="ghost small" title="全部折叠">折叠</button>
                  <button type="button" id="btn-ask-map" class="primary small" title="提问 ( ? )">提问</button>
                </div>
              </header>
              <div class="viewer-body browse-body">
                <div class="browse-layout" id="browse-layout">
                  <section class="browse-main">
                    <div class="browse-bar">
                      <nav id="browse-crumb" class="browse-crumb" aria-label="路径"></nav>
                      <span class="browse-hint muted tiny">↑↓ 移动 · ←→ 折叠 · Enter 展开 · / 搜索 · A 提问</span>
                    </div>
                    <div id="outline-list" class="outline-list" tabindex="0" role="tree" aria-label="节点大纲"></div>
                  </section>
                  <aside id="node-detail" class="node-detail">
                    <p class="muted tiny detail-empty">选中左侧节点查看详情</p>
                    <div id="node-detail-body" class="hidden">
                      <h3 id="detail-title"></h3>
                      <p id="detail-meta" class="muted tiny"></p>
                      <div id="detail-note" class="detail-note"></div>
                      <div id="detail-children" class="detail-children"></div>
                    </div>
                  </aside>
                </div>
                <aside id="ask-panel" class="ask-panel">
                  <div class="ask-head">
                    <strong>针对此图提问</strong>
                    <button type="button" id="btn-close-ask" class="ghost small hide-desktop">关闭</button>
                  </div>
                  <div id="ask-chat" class="msg-stream ask-chat" aria-live="polite"></div>
                  <div class="ask-composer">
                    <textarea id="ask-input" rows="3" placeholder="例如：总结这张图的结构 / 找出待办…"></textarea>
                    <div class="ask-bar">
                      <select id="ask-profile" title="模型"></select>
                      <button type="button" id="btn-ask-send" class="primary">发送</button>
                    </div>
                  </div>
                </aside>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="view-chat" class="view hidden">
        <div class="chat-layout">
          <aside class="sidebar">
            <div class="side-top">
              <span class="side-label">历史</span>
              <button type="button" id="btn-new" class="ghost small">新对话</button>
            </div>
            <div id="conv-list" class="conv-list"></div>
          </aside>
          <section class="main chat-main">
            <header class="top chat-top">
              <div class="brand chat-brand">
                <div class="title-edit">
                  <input id="conv-title-input" class="title-input" maxlength="120" placeholder="对话标题" />
                  <button type="button" id="btn-rename" class="ghost small">重命名</button>
                </div>
                <span id="status-pill" class="pill">…</span>
              </div>
              <div class="top-actions">
                <label class="inline-field">
                  <span>模型</span>
                  <select id="profile-select"></select>
                </label>
              </div>
            </header>
            <main id="chat" class="msg-stream chat" aria-live="polite"></main>
            <footer class="composer">
              <div class="composer-box">
                <textarea id="input" rows="3" placeholder="询问或操作导图…（Enter 发送，Shift+Enter 换行）"></textarea>
                <div class="composer-bar">
                  <span class="muted tiny">用户消息靠右 · 助手靠左 · 可公开单条回答</span>
                  <button type="button" id="btn-send" class="primary">发送</button>
                </div>
              </div>
            </footer>
          </section>
        </div>
      </section>

      <section id="view-settings" class="view hidden">
        <div class="settings-page settings-split">
          <aside class="profile-list-panel">
            <div class="side-head">
              <h2>模型配置</h2>
              <button type="button" id="btn-llm-new" class="primary small">新建</button>
            </div>
            <p class="muted tiny">桌面侧栏与网页共用同一份配置，可保存多套并随时切换。</p>
            <div id="profile-list" class="profile-list"></div>
          </aside>
          <section class="settings profile-editor">
            <h3 id="llm-editor-title">编辑配置</h3>
            <div class="settings-grid">
              <label
                >服务商
                <select id="llm-provider">
                  <option value="openrouter">OpenRouter（推荐）</option>
                  <option value="openai">OpenAI 官方</option>
                  <option value="custom">自定义 OpenAI 兼容</option>
                </select>
              </label>
              <label>名称 <input id="llm-name" placeholder="OpenRouter" /></label>
              <label>Base URL <input id="llm-base" placeholder="https://openrouter.ai/api/v1" /></label>
              <label>API Key <input id="llm-key" type="password" placeholder="sk-or-… 或留空保留原 Key" /></label>
              <label class="span-2"
                >模型
                <input id="llm-model" list="llm-model-hints" placeholder="openai/gpt-4o-mini" />
                <datalist id="llm-model-hints">
                  <option value="openai/gpt-4o-mini"></option>
                  <option value="openai/gpt-4o"></option>
                  <option value="anthropic/claude-3.5-sonnet"></option>
                  <option value="google/gemini-2.0-flash-001"></option>
                  <option value="deepseek/deepseek-chat"></option>
                  <option value="qwen/qwen-2.5-72b-instruct"></option>
                </datalist>
              </label>
            </div>
            <label class="check"><input id="llm-default" type="checkbox" checked /> 设为默认</label>
            <div class="settings-row">
              <button type="button" id="btn-llm-save" class="primary">保存</button>
              <button type="button" id="btn-llm-del" class="ghost">删除</button>
              <button type="button" id="btn-llm-use" class="ghost">设为当前选用</button>
              <span id="llm-note" class="muted"></span>
            </div>
          </section>
        </div>
      </section>

      <nav class="mobile-nav" aria-label="移动导航">
        <button type="button" class="nav-btn active" data-view="library">导图</button>
        <button type="button" class="nav-btn" data-view="chat">对话</button>
        <button type="button" class="nav-btn" data-view="settings">模型</button>
      </nav>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>
    <script src="./app.js"></script>
  </body>
</html>
