<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Twigmark · 公开问答</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="share-page">
      <p class="share-top-nav"><a href="./shares.html">← 全部公开问答</a> · <a href="./">Twigmark</a></p>
      <article class="share-card share-detail-card">
        <div class="logo-mark small" aria-hidden="true"></div>
        <h1 id="title">公开问答</h1>
        <p class="share-meta" id="meta">加载中…</p>
        <section class="share-qa-block">
          <p class="share-q-label">问</p>
          <div class="share-q-body" id="question"></div>
        </section>
        <section class="share-qa-block" id="gate-section" hidden>
          <p class="share-q-label">访问问题</p>
          <p class="share-gate-prompt" id="gate-prompt"></p>
          <form id="gate-form" class="share-gate-form">
            <label
              >你的回答
              <input id="gate-answer" type="text" autocomplete="off" placeholder="回答正确后可见答案" />
            </label>
            <button type="submit" class="primary small">查看答案</button>
            <p id="gate-error" class="err tiny"></p>
          </form>
        </section>
        <section class="share-qa-block" id="answer-section">
          <p class="share-a-label">答</p>
          <div class="share-body" id="body"></div>
        </section>
        <p class="share-foot">不含工具轨迹、导图路径或账号信息。作者可随时撤销公开。</p>
      </article>
    </div>
    <script>
      (function () {
        function escapeHtml(text) {
          return String(text || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }
        function renderMarkdown(text) {
          var raw = String(text || "");
          var blocks = [];
          raw = raw.replace(/```([\s\S]*?)```/g, function (_, code) {
            var i = blocks.length;
            blocks.push("<pre><code>" + escapeHtml(code.replace(/^\n/, "")) + "</code></pre>");
            return "%%BLOCK" + i + "%%";
          });
          var html = escapeHtml(raw)
            .replace(/`([^`]+)`/g, "<code>$1</code>")
            .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
            .replace(/\n/g, "<br>");
          return html.replace(/%%BLOCK(\d+)%%/g, function (_, idx) {
            return blocks[Number(idx)] || "";
          });
        }
        function fmtExpiry(expiresAt) {
          if (!expiresAt) return "";
          try {
            return "有效期至 " + new Date(Number(expiresAt)).toLocaleString();
          } catch (e) {
            return "";
          }
        }
        var params = new URLSearchParams(location.search);
        var token = params.get("t") || "";
        var titleEl = document.getElementById("title");
        var metaEl = document.getElementById("meta");
        var questionEl = document.getElementById("question");
        var bodyEl = document.getElementById("body");
        var gateSection = document.getElementById("gate-section");
        var gatePrompt = document.getElementById("gate-prompt");
        var gateForm = document.getElementById("gate-form");
        var gateAnswer = document.getElementById("gate-answer");
        var gateError = document.getElementById("gate-error");
        var answerSection = document.getElementById("answer-section");

        function renderShare(data) {
          if (data.title) titleEl.textContent = data.title;
          var bits = [];
          if (data.model) bits.push(data.model);
          if (data.sharedAt) {
            try {
              bits.push("公开于 " + new Date(Number(data.sharedAt)).toLocaleString());
            } catch (e) {}
          }
          var exp = fmtExpiry(data.expiresAt);
          if (exp) bits.push(exp);
          metaEl.textContent = bits.join(" · ") || "公开问答";
          questionEl.innerHTML = renderMarkdown(data.question || "(无问题文本)");
          if (data.locked) {
            answerSection.hidden = true;
            gateSection.hidden = false;
            gatePrompt.textContent = data.gateQuestion || "请回答问题";
            gateAnswer.value = "";
            gateError.textContent = "";
          } else {
            gateSection.hidden = true;
            answerSection.hidden = false;
            bodyEl.innerHTML = renderMarkdown(data.content || "");
          }
        }

        if (!token) {
          metaEl.textContent = "缺少分享令牌";
          answerSection.hidden = true;
          return;
        }

        gateForm.addEventListener("submit", function (e) {
          e.preventDefault();
          gateError.textContent = "";
          fetch("../api/public/share/" + encodeURIComponent(token) + "/unlock", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ answer: gateAnswer.value }),
            cache: "no-store",
          })
            .then(function (r) {
              return r.json().then(function (body) {
                return { ok: r.ok, status: r.status, body: body };
              });
            })
            .then(function (res) {
              if (!res.ok) {
                gateError.textContent =
                  (res.body && res.body.error) || (res.status === 403 ? "回答不正确" : "无法解锁");
                return;
              }
              renderShare(res.body);
            })
            .catch(function () {
              gateError.textContent = "网络错误";
            });
        });

        fetch("../api/public/share/" + encodeURIComponent(token), { cache: "no-store" })
          .then(function (r) {
            return r.json().then(function (body) {
              return { ok: r.ok, body: body };
            });
          })
          .then(function (res) {
            if (!res.ok) {
              metaEl.textContent = (res.body && res.body.error) || "无法打开分享";
              answerSection.hidden = true;
              gateSection.hidden = true;
              return;
            }
            renderShare(res.body);
          })
          .catch(function () {
            metaEl.textContent = "网络错误";
          });
      })();
    </script>
  </body>
</html>
