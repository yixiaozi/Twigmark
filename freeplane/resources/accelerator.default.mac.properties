# Mac-friendly accelerator overrides (no Insert key; avoid Option+Space IME conflict).
# Applied via PlatformHotKeyGuide + RibbonAcceleratorManager.applyPlatformDefaultAccelerators.
# Stored separately as ribbons/accelerator-mac.properties (does not overwrite Windows).

ribbon.acceleratorFor.MindMap/NewChildAction=TAB
ribbon.acceleratorFor.MindMap/NewParentNode=shift TAB
ribbon.acceleratorFor.MindMap/NewSummaryAction=meta shift I
ribbon.acceleratorFor.MindMap/MapSwitcherAction=meta shift O
ribbon.acceleratorFor.MindMap/QuickCaptureAction=meta shift SPACE
ribbon.acceleratorFor.MindMap/QuickCommandAction=meta shift PERIOD
