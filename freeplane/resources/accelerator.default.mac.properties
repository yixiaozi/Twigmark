# Mac-friendly accelerator overrides.
# Option+Space is commonly taken by the input-source switcher; provide Command-based alternatives.
# Loaded after the shared defaults (and after user presets for missing keys only when applied via
# applyPlatformDefaultAccelerators — user-assigned values in accelerator.properties always win).

ribbon.acceleratorFor.MindMap/MapSwitcherAction=meta shift O
ribbon.acceleratorFor.MindMap/QuickCaptureAction=meta shift SPACE
ribbon.acceleratorFor.MindMap/QuickCommandAction=meta shift PERIOD
