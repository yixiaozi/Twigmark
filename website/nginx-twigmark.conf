server {
    listen 80;
    listen [::]:80;
    server_name twigmark.com www.twigmark.com;

    root /var/www/twigmark;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    access_log /var/log/nginx/twigmark.access.log;
    error_log  /var/log/nginx/twigmark.error.log;
}
